<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дрібка Смаку - Меню</title>
    <link rel="stylesheet" href="css/menustyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/cartService.js"></script>
    <script src="js/menu.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <nav class="nav-bar">
                <button class="back-btn">← Назад</button>
                <div class="nav-items">
                    <select class="address-select">
                        <option>Вибрати Місто</option>
                        <option>Львів</option>
                        <option>Дрогобич</option>
                        <option>Черкаси</option>
                    </select>
                    <div class="search-container">
                        <img src="images/leading-icon.png" alt="Search" class="search-icon">
                        <input type="text" class="search-input" placeholder="Пошук" id="search-input">
                    </div>
                    <img src="images/cart.png" alt="Cart" class="cart-icon">
                    <a href="profile.html" class="btn">
                        <img src="images/profile.png" alt="Profile" class="profile-icon" />
                    </a>
                </div>
            </nav>
            <div class="hero-image">
                <img id="restaurant-image" src="images/default.jpg" alt="Головне фото ресторану">
                <div class="overlay">
                    <h1 id="restaurant-title">Завантаження...</h1>
                    <div class="dose-info">
                        <span class="rating">4.7 ★ (+1000)</span>
                        <span class="hours">10:00 до 22:00</span>
                    </div>
                </div>
            </div>
            <div class="delivery-options">
                <div class="delivery-toggle">
                    <button class="delivery active">Доставка</button>
                    <button class="pickup">Самовивіз</button>
                </div>
            </div>
        </header>
        
        <main class="main-content">
            <section class="special-offers">
                <div class="filters">
                    <button id="filter-btn" class="filter-btn">Фільтр</button>
                    <select id="sort-select" class="sort-select">
                        <option value="popularity-desc">За популярністю</option>
                        <option value="price-asc">Від дешевих до дорогих</option>
                        <option value="price-desc">Від дорогих до дешевих</option>
                        <option value="popularity-asc">За рейтингом (за зростанням)</option>
                    </select>
                </div>
                <h2>Найкращі пропозиції</h2>
                <div class="menu-items" id="special-offers-items">
                </div>
            </section>
            
            <section class="full-menu">
                <h2>Усе меню</h2>
                <div class="menu-items" id="full-menu-items">
                </div>
            </section>
        </main>
    </div>
</body>
</html>
