<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Оформлення замовлення</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="css/orderStyle.css">
</head>
<body>
  <div class="container-fluid bg-pink py-2 text-start px-3">
    <button class="btn btn-light" onclick="history.back()"><i class="bi bi-arrow-left"></i> Назад</button>
  </div>

  <div class="container mt-3">
    <div class="row g-3">
<!-- Ліва колонка -->
<div class="col-md-6">
  <div class="card-custom bg-purple mb-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0 text-dark">Деталі замовлення</h5>
      <div class="toggle-switch bg-light rounded-pill px-1 py-1">
        <button class="btn btn-dark btn-sm rounded-pill px-3 me-1" id="deliveryBtn">Доставка</button>
        <button class="btn btn-light btn-sm rounded-pill px-3" id="pickupBtn">Самовивіз</button>
      </div>
    </div>

    <!-- Блоки для доставки -->
    <div id="deliveryBlocks">
    <!-- Адреса -->
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <label class="form-label d-flex align-items-center gap-2 mb-0">
          <i class="bi bi-geo-alt"></i> Адреса
        </label>
        <button class="btn btn-outline-light btn-sm rounded-circle d-flex align-items-center justify-content-center p-2" style="width: 32px; height: 32px;" onclick="openAddressModal()" aria-label="Редагувати адресу">
          <i class="bi bi-pencil"></i>
        </button>
      </div>
      <div class="address-text mt-2">Натисніть щоб обрати адресу</div>
      <input type="hidden" id="address" name="address" required>
    </div>

    <!-- Коментар для кур'єра -->
    <div class="mb-3" data-courier-block="true">
      <label class="comment-label d-flex align-items-center gap-2">
        <i class="bi bi-chat-text"></i> Коментар для кур'єра
      </label>
      <div class="comment-container">
        <textarea class="form-control" rows="3" id="courier-comment" placeholder="Вкажіть особливості доставки, номер під'їзду, поверх, тощо..." required></textarea>
        <button class="save-comment-btn" id="save-courier-comment">Зберегти</button>
      </div>
    </div>
    </div>

    <!-- Блоки для самовивозу -->
    <div id="pickupBlocks" style="display: none;">
      <!-- Вибір ресторану -->
      <div class="mb-3">
        <label class="form-label d-flex align-items-center gap-2">
          <i class="bi bi-shop"></i> Ресторан
        </label>
        <select class="form-select" id="restaurantSelect" required>
          <option value="">Оберіть ресторан</option>
          <option value="1">вул. Шевченка, 123</option>
          <option value="2">вул. Франка, 45</option>
          <option value="3">просп. Свободи, 67</option>
        </select>
      </div>

      <!-- Вибір часу -->
      <div class="mb-3">
        <label class="form-label d-flex align-items-center gap-2">
          <i class="bi bi-clock"></i> Час отримання
        </label>
        <input type="time" class="form-control" id="pickupTime" min="10:00" max="22:00" required>
        <small class="text-dark mt-1 d-block">Ресторан працює з 10:00 до 22:00</small>
      </div>
    </div>

    <!-- Телефон (спільний для обох варіантів) -->
    <div class="mb-3 d-flex justify-content-between align-items-center">
      <label class="form-label d-flex align-items-center gap-2 mb-0">
        <i class="bi bi-telephone"></i> Телефон
        <div id="phoneInputWrapper" class="ms-2" style="overflow: hidden; width: 0;">
          <input type="tel" class="form-control form-control-sm" id="phone" placeholder="Введіть номер" disabled required>
        </div>
      </label>
      <button class="btn btn-outline-light btn-sm rounded-circle d-flex align-items-center justify-content-center p-2" style="width: 32px; height: 32px;" onclick="togglePhoneEdit()" aria-label="Редагувати телефон">
        <i class="bi bi-pencil"></i>
      </button>
    </div>
  </div>

  <!-- Спосіб оплати -->
  <div class="card-custom payment-methods p-3 rounded">
    <h5 class="mb-3 text-dark">Спосіб оплати</h5>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="pay" id="pay1" checked>
      <label class="form-check-label" for="pay1">Apple Pay</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="pay" id="pay2">
      <label class="form-check-label" for="pay2">За реквізитами карти</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="pay" id="pay3">
      <label class="form-check-label" for="pay3">Готівкою кур'єру</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="pay" id="pay4">
      <label class="form-check-label" for="pay4">Карткою кур'єру</label>
    </div>
  </div>

  <!-- Коментар -->
  <div class="card-custom bg-purple mt-3">
    <label class="comment-label d-flex align-items-center gap-2">
      <i class="bi bi-chat-text"></i> Коментар до замовлення
    </label>
    <div class="comment-container">
      <textarea class="form-control" rows="3" id="general-comment" placeholder="Додаткові побажання до замовлення..." required></textarea>
      <button class="save-comment-btn" id="save-general-comment">Зберегти</button>
    </div>
  </div>
</div>

  
      <!-- Права колонка -->
      <div class="col-md-6">
        <div class="card-custom bg-purple mb-3">
          <h5 class="text-dark">Ваше замовлення</h5>
          <div id="order-items">
            <!-- Тут буде динамічно згенерований список страв -->
          </div>
          <div class="input-group mt-3">
            <input type="text" id="promo" class="form-control" placeholder="Промокод">
            <button class="btn btn-light" onclick="applyPromo()">Активувати</button>
          </div>
        </div>
  
        <div class="card-custom bg-purple">
          <h5 class="text-dark">Сума до сплати</h5>
          <ul class="list-group mb-3" id="summary">
            <!-- Тут буде динамічно згенерований список з сумою -->
          </ul>
          <button class="payment-btn w-100" onclick="handlePayment()">Оплатити</button>
        </div>
      </div>
    </div>
  </div>
  

  <!-- GSAP для анімацій -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- Bootstrap Bundle JS (включає Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CartService -->
  <script src="js/cartService.js"></script>

  <!-- Модальне вікно -->
  <div class="modal" id="addressModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Редагувати адресу</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-building"></i></span>
                <input type="text" id="city" class="form-control" placeholder="Місто" autocomplete="address-level2" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-signpost"></i></span>
                <input type="text" id="street" class="form-control" placeholder="Вулиця" autocomplete="address-line1" required>
              </div>
            </div>
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-layers"></i></span>
                <input type="text" id="floor" class="form-control" placeholder="Поверх" required>
              </div>
            </div>
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-door-open"></i></span>
                <input type="text" id="apartment" class="form-control" placeholder="Квартира" required>
              </div>
            </div>
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-box-arrow-in-right"></i></span>
                <input type="text" id="entrance" class="form-control" placeholder="Під'їзд" required>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary px-4" id="saveAddressBtn">Зберегти</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Твій скрипт -->
  <script src="js/orderScript.js"></script>
</body>
</html>
