<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Оплата замовлення</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/paymentStyle.css">
</head>
<body>
  <div class="container-fluid bg-pink py-3 text-start px-4">
    <button class="btn btn-light" onclick="history.back()"><i class="bi bi-arrow-left"></i> Назад</button>
  </div>

  <div class="container mt-4">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card-custom">
          <h5 class="mb-4">Інформація про замовлення</h5>
          <div id="order-details">
          </div>
          <div class="summary mt-4">
            <div class="d-flex justify-content-between mb-2">
              <span>Вартість страв</span>
              <span id="subtotal">0 ₴</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span>Доставка</span>
              <span id="delivery">0 ₴</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span>Сервісний збір</span>
              <span id="service">0 ₴</span>
            </div>
            <div class="d-flex justify-content-between total-amount">
              <span>Всього до сплати</span>
              <strong id="total">0 ₴</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Права колонка - Форма оплати -->
      <div class="col-md-6">
        <div class="card-custom">
          <h5 class="mb-4">Оплата карткою</h5>
          <form id="payment-form">
            <div class="mb-4">
              <label class="form-label">Номер картки</label>
              <div class="input-group">
                <input type="text" class="form-control" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19">
                <span class="input-group-text">
                  <i class="bi bi-credit-card"></i>
                </span>
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label">Термін дії</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="expiry" placeholder="MM/YY" maxlength="5">
                  <span class="input-group-text">
                    <i class="bi bi-calendar"></i>
                  </span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">CVV</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="cvv" placeholder="***" maxlength="3">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Ім'я власника картки</label>
              <div class="input-group">
                <input type="text" class="form-control" id="card-holder" placeholder="YURII PROKOPIV">
                <span class="input-group-text">
                  <i class="bi bi-person"></i>
                </span>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100" id="pay-button">
              Оплатити <span id="pay-amount"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Service -->
  <script src="js/cartService.js"></script>
  
  <!-- Payment Script -->
  <script src="js/paymentScript.js"></script>
</body>
</html>
